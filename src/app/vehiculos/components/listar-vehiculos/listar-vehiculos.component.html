<div class="img-center">
  <img src="../../../../assets/images/banner-tusegundazoapp.png" alt="Banner TuSegundazoApp" class="img-fluid">
</div>

<div class="container mt-4">
  <h3 class="text-center fw-bold mb-4">COMERCIALIZACIÓN DE AUTOMOTORES<br><small>NUEVOS Y USADOS</small></h3>

  <table class="table table-striped text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th>Marca</th>
        <th>Línea</th>
        <th>Modelo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let vehiculo of vehiculos">
        <td>{{ vehiculo.marca }}</td>
        <td>{{ vehiculo.linea }}</td>
        <td>{{ vehiculo.modelo }}</td>
      </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <p *ngFor="let marca of (conteoPorMarca | keyvalue)">
      Total de {{ marca.key }}: {{ marca.value }}
    </p>
  </div>

  <footer class="text-center mt-4 small text-muted">
    Contact us: +57 3102105253 · info@tusegundazo.com · @tusegundazo
  </footer>
</div>
